[package]
name = "paperb-bp-audited"
version = "0.1.0"
edition = "2018"

[dependencies]
bulletproofs = "=1.0.2"
curve25519-dalek = "=1.2.1"
merlin = "=1.1.0"
rand = "=0.6.5"
sha2 = "=0.8.0"

# Freeze the direct transitive versions used at the June 2019 audit date.
# Without these constraints Cargo 1.37 resolves semver-compatible releases
# from 2026 whose manifests require the 2021 edition.
byteorder = "=1.3.2"
backtrace = "=0.3.29"
autocfg = "=0.1.4"
cfg-if = "=0.1.9"
failure_derive = "=0.1.5"
keccak = "=0.1.0"
libc = "=0.2.58"
quote = "=0.6.12"
rustc-demangle = "=0.1.15"
syn = "=0.15.35"
typenum = "=1.10.0"
winapi = "=0.3.7"
cc = "=1.0.37"
clear_on_drop = "=0.2.3"
digest = "=0.8.1"
failure = "=0.1.5"
serde = "=1.0.92"
serde_derive = "=1.0.92"
sha3 = "=0.8.2"
subtle = "=2.1.0"

[profile.release]
lto = true
codegen-units = 1
